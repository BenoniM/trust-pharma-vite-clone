<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#53c5e8" />
    <meta name="description" content="Trust Pharmaceuticals Manufacturing website recreation built with React and Vite." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Trust Pharmaceuticals Manufacturing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <script>
      (function(){
        var img = new Image();
        img.onload = function(){
          var size = Math.max(img.width, img.height);
          var c = document.createElement('canvas');
          c.width = size; c.height = size;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, (size - img.width) / 2, (size - img.height) / 2);
          var link = document.querySelector("link[rel='icon']");
          if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
          link.type = 'image/png';
          link.href = c.toDataURL('image/png');
        };
        img.src = '/logo.png';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
